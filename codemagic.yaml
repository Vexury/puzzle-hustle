workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dev.vexury.puzzlehustle
      node: 24
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build web
        script: pnpm build
      - name: Sync Capacitor
        script: |
          cd apps/web
          pnpm exec cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd apps/web/ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" App.xcodeproj/project.pbxproj
      - name: Build ipa
        script: |
          cd apps/web/ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - apps/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
