name = "puzzle-hustle-api"
main = "src/index.ts"
compatibility_date = "2026-09-21"
routes = [{ pattern = "puzzles-api.vexury.dev", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "puzzle-hustle"
database_id = "3aa05e1b-06eb-4bb2-9d15-bcab2554d587"
migrations_dir = "migrations"

# /session is the one route without a token in front of it, so it gets the platform's own
# rate limiter. The binding does not exist under Miniflare, and the code treats it as optional.
[[ratelimits]]
name = "SESSION_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
GOOGLE_CLIENT_IDS = "455101583494-lfg3kbscmqgubeqrsocg0919269n2a23.apps.googleusercontent.com"
# The iOS bundle ID. A Services ID joins it once Apple sign-in comes to the web.
APPLE_AUDIENCES = "dev.vexury.puzzlehustle"
