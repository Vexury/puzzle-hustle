<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Puzzle Hustle</title>
  <meta name="description" content="Daily, weekly and monthly logic puzzles. Shapes, Nonogram, Mosaic, Killer Sudoku and more.">
  <meta name="theme-color" content="#faf9f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Puzzle Hustle">
  <meta property="og:title" content="Puzzle Hustle">
  <meta property="og:description" content="Daily, weekly and monthly logic puzzles.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
