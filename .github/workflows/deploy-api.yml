name: Deploy API

# Separate from the web deploy on purpose: a failing API test must not block the website,
# and a web-only change must not redeploy the Worker.
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @puzzle-hustle/core test
      - run: pnpm --filter @puzzle-hustle/api test
      - run: pnpm --filter @puzzle-hustle/api typecheck
      # Uses the wrangler version pinned in apps/api rather than a third-party action, so a
      # deploy always runs the same binary the developer ran locally.
      # Migrations stay manual (`pnpm --filter @puzzle-hustle/api migrate:remote`): D1
      # migrations are forward-only, and a bad one applied automatically to production is a
      # worse problem than a forgotten one.
      - run: pnpm --filter @puzzle-hustle/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
